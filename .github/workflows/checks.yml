name: AssayScope checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      public_pack:
        description: Fetch and verify the separate 117 MB public reference pack
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  local-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.13'
      - name: Install exact local dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip check
      - name: Build and verify frontend
        run: |
          npm run contracts
          git diff --exit-code -- src/catalog.generated.d.ts src/lab-context.generated.d.ts src/reviews.generated.d.ts
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run repo:check
          npm run test:repository
      - name: Scientific and local API checks
        run: |
          .venv/bin/python -m assayscope.generator
          .venv/bin/python -m pytest
          .venv/bin/python -m ruff check assayscope research tests scripts
          .venv/bin/python -m scripts.build_research_notebook --check
          .venv/bin/python -m assayscope.ingest
          .venv/bin/python -m research.review
          .venv/bin/python -m research.context
          .venv/bin/python -m research.knowledge
      - name: Compile tenant adapter without cloud access
        working-directory: rayfin/functions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm --prefix ../.. run functions:types
          git diff --exit-code -- src/types.ts runtimemetadata.json
      - name: Optional real public pack
        if: inputs.public_pack == true
        run: .venv/bin/python -m assayscope.public_data fetch
      - name: Browser behavior on isolated server
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python scripts/verify_browser.py --software-webgl --record
          .venv/bin/python scripts/verify_docs.py
      - name: Guarded offline deployment checks
        run: |
          pwsh -NoLogo -NoProfile -File scripts/verify_deployment.ps1
          pwsh -NoLogo -NoProfile -File scripts/verify_knowledge.ps1
          npm run fabric:plan -- --offline
          npm run fabric:research:plan -- --offline
          npm run fabric:knowledge:plan -- --offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: assayscope-build-and-evidence
          retention-days: 7
          path: |
            dist
            test-results/browser-acceptance.json
            test-results/deployment-local.json
            test-results/knowledge-local.json
            test-results/verified-evidence.zip
            test-results/walkthrough.webm
            test-results/research
            test-results/documentation/acceptance.json
            docs/screenshots
