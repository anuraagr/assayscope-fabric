<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" role="img" aria-labelledby="title description">
<title id="title">Research ontology and lab-context boundaries</title><desc id="description">Deployed knowledge items use the curated Lakehouse. The external LIMS / ELN connection remains unconfigured. Ontology and data agent share curated tables. The agent queries the Lakehouse, not a separately configured ontology tool. LIMS/ELN remains the sample-context system of record. Ontology relationships and agent instructions never grant data access.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526778"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#152938">
<text x="30" y="48" font-size="30" font-weight="650">Research ontology and lab-context boundaries</text><text x="30" y="82" font-size="16" font-weight="400">Deployed knowledge items use the curated Lakehouse. The external LIMS / ELN connection remains unconfigured.</text>
<path d="M400 255 L475 255" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1105 340 L1105 460" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M920 545 L885 545 L885 255 L845 255" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M215 340 L215 390 L660 390 L660 460" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M475 545 L400 545" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/><g data-node-id="evidence-tables"><rect x="30" y="170" width="370" height="170" rx="10" fill="#e6f6f7" stroke="#0c8599" stroke-width="1.5"/><text x="48" y="204" font-size="18" font-weight="600">Existing analytical evidence</text><text x="48" y="235" font-size="15" font-weight="400">Five source tables; seven curated tables</text><text x="48" y="259" font-size="15" font-weight="400">Validated run and condition summaries</text><text x="48" y="283" font-size="15" font-weight="400">Source hashes and explicit data origin</text></g>
<g data-node-id="ontology-proposal"><rect x="475" y="170" width="370" height="170" rx="10" fill="#fff5df" stroke="#b46b08" stroke-width="1.5"/><text x="493" y="204" font-size="18" font-weight="600">Fabric IQ ontology</text><text x="493" y="235" font-size="15" font-weight="400">Seven entities and six relationships</text><text x="493" y="259" font-size="15" font-weight="400">Generation-2 TMDL source bindings</text><text x="493" y="283" font-size="15" font-weight="400">No inferred biology or access grants</text></g>
<g data-node-id="external-system"><rect x="920" y="170" width="370" height="170" rx="10" fill="#f1f4f6" stroke="#495057" stroke-width="1.5"/><text x="938" y="204" font-size="18" font-weight="600">External LIMS / ELN</text><text x="938" y="235" font-size="15" font-weight="400">Sample, batch and protocol records</text><text x="938" y="259" font-size="15" font-weight="400">System-of-record IDs and versions</text><text x="938" y="283" font-size="15" font-weight="400">No authorized endpoint supplied</text></g>
<g data-node-id="human-review"><rect x="30" y="460" width="370" height="170" rx="10" fill="#e6f6f7" stroke="#0c8599" stroke-width="1.5"/><text x="48" y="494" font-size="18" font-weight="600">Human research review</text><text x="48" y="525" font-size="15" font-weight="400">Inspect images and cited records</text><text x="48" y="549" font-size="15" font-weight="400">Record rationale in the workbench</text><text x="48" y="573" font-size="15" font-weight="400">No automatic repeat-task creation</text></g>
<g data-node-id="agent-proposal"><rect x="475" y="460" width="370" height="170" rx="10" fill="#fff5df" stroke="#b46b08" stroke-width="1.5"/><text x="493" y="494" font-size="18" font-weight="600">Read-only data agent</text><text x="493" y="525" font-size="15" font-weight="400">Scoped questions with evidence citations</text><text x="493" y="549" font-size="15" font-weight="400">No private reviews or arbitrary URLs</text><text x="493" y="573" font-size="15" font-weight="400">Source access enforced independently</text></g>
<g data-node-id="context-bridge"><rect x="920" y="460" width="370" height="170" rx="10" fill="#e7f2fc" stroke="#1864ab" stroke-width="1.5"/><text x="938" y="494" font-size="18" font-weight="600">Reviewed context boundary</text><text x="938" y="525" font-size="15" font-weight="400">Schema, exact joins, version and freshness</text><text x="938" y="549" font-size="15" font-weight="400">Four example-only records in Lakehouse</text><text x="938" y="573" font-size="15" font-weight="400">Unmatched records stay visibly missing</text></g>
<text x="30" y="735" font-size="14" font-weight="400">Ontology and data agent share curated tables. The agent queries the Lakehouse, not a separately configured ontology tool.</text>
<text x="30" y="761" font-size="14" font-weight="400">LIMS/ELN remains the sample-context system of record. Ontology relationships and agent instructions never grant data access.</text>
</g></svg>
