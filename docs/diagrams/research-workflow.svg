<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780" role="img" aria-labelledby="title description">
<title id="title">A research review from comparison to evidence</title><desc id="description">Use image-derived observations to decide what needs inspection, repetition or confirmatory research. n = technical wells within one run. Cells and timepoints do not increase n; the two simulated runs are not biological replicates. Research demonstration only. Reporter or morphology changes do not establish efficacy, safety, viability or mechanism.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526778"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#152938">
<text x="30" y="48" font-size="30" font-weight="650">A research review from comparison to evidence</text><text x="30" y="82" font-size="16" font-weight="400">Use image-derived observations to decide what needs inspection, repetition or confirmatory research.</text>
<path d="M410 235 L470 235" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M850 235 L910 235" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1100 320 L1100 430" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M910 515 L850 515" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M470 515 L410 515" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/><g data-node-id="question"><rect x="30" y="150" width="380" height="170" rx="10" fill="#e7f2fc" stroke="#1864ab" stroke-width="1.5"/><text x="48" y="184" font-size="18" font-weight="600">1. Define the comparison</text><text x="48" y="215" font-size="15" font-weight="400">Question, controls and endpoint</text><text x="48" y="239" font-size="15" font-weight="400">Run, dose and technical-well identity</text><text x="48" y="263" font-size="15" font-weight="400">Keep public studies separate</text></g>
<g data-node-id="inspect"><rect x="470" y="150" width="380" height="170" rx="10" fill="#e7f2fc" stroke="#1864ab" stroke-width="1.5"/><text x="488" y="184" font-size="18" font-weight="600">2. Inspect the source images</text><text x="488" y="215" font-size="15" font-weight="400">Channels, calibration and real timepoints</text><text x="488" y="239" font-size="15" font-weight="400">Linked treatment/control display</text><text x="488" y="263" font-size="15" font-weight="400">Do not infer biology from color</text></g>
<g data-node-id="quality"><rect x="910" y="150" width="380" height="170" rx="10" fill="#fff5df" stroke="#b46b08" stroke-width="1.5"/><text x="928" y="184" font-size="18" font-weight="600">3. Examine acquisition quality</text><text x="928" y="215" font-size="15" font-weight="400">Focus, saturation, illumination, counts</text><text x="928" y="239" font-size="15" font-weight="400">Review the affected original image</text><text x="928" y="263" font-size="15" font-weight="400">A flag is not a proven root cause</text></g>
<g data-node-id="sensitivity"><rect x="910" y="430" width="380" height="170" rx="10" fill="#fff5df" stroke="#b46b08" stroke-width="1.5"/><text x="928" y="464" font-size="18" font-weight="600">4. Test QC exclusion sensitivity</text><text x="928" y="495" font-size="15" font-weight="400">Recompute within-run controls and means</text><text x="928" y="519" font-size="15" font-weight="400">Show n, sample SD and excluded wells</text><text x="928" y="543" font-size="15" font-weight="400">Missing controls remain not estimable</text></g>
<g data-node-id="decision"><rect x="470" y="430" width="380" height="170" rx="10" fill="#e6f6f7" stroke="#0c8599" stroke-width="1.5"/><text x="488" y="464" font-size="18" font-weight="600">5. Record a human review</text><text x="488" y="495" font-size="15" font-weight="400">Investigate or repeat an acquisition</text><text x="488" y="519" font-size="15" font-weight="400">Consider confirmatory research</text><text x="488" y="543" font-size="15" font-weight="400">Save the rationale; retain originals</text></g>
<g data-node-id="evidence"><rect x="30" y="430" width="380" height="170" rx="10" fill="#e6f6f7" stroke="#0c8599" stroke-width="1.5"/><text x="48" y="464" font-size="18" font-weight="600">6. Share the evidence</text><text x="48" y="495" font-size="15" font-weight="400">Readable report and measurement CSV</text><text x="48" y="519" font-size="15" font-weight="400">Image, source hash, method and QC rules</text><text x="48" y="543" font-size="15" font-weight="400">An authorized link does not grant access</text></g>
<text x="30" y="715" font-size="14" font-weight="400">n = technical wells within one run. Cells and timepoints do not increase n; the two simulated runs are not biological replicates.</text>
<text x="30" y="741" font-size="14" font-weight="400">Research demonstration only. Reporter or morphology changes do not establish efficacy, safety, viability or mechanism.</text>
</g></svg>
