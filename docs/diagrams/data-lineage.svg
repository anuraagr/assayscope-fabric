<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="960" viewBox="0 0 1320 960" role="img" aria-labelledby="title description">
<title id="title">From analytical records back to image evidence</title><desc id="description">Stable identifiers connect the five Lakehouse tables. Reviews remain separate transactional records. Generator truth is held outside served/uploaded assets and is used only for synthetic evaluation; it is not an analysis input. The notebook checks record joins and versions. Actual image-byte hash verification is a separate integrity check.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526778"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#152938">
<text x="30" y="48" font-size="30" font-weight="650">From analytical records back to image evidence</text><text x="30" y="82" font-size="16" font-weight="400">Stable identifiers connect the five Lakehouse tables. Reviews remain separate transactional records.</text>
<path d="M560 250 L560 285 L220 285 L220 330" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M660 250 L660 330" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M390 405 L490 405" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M830 405 L930 405" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M660 480 L660 595" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1100 480 L1100 595" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M220 595 L220 540 L540 540 L540 480" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/><g data-node-id="experiment"><rect x="490" y="125" width="340" height="125" rx="10" fill="#e7f2fc" stroke="#1864ab" stroke-width="1.5"/><text x="508" y="159" font-size="18" font-weight="600">Experiment</text><text x="508" y="190" font-size="15" font-weight="400">assayscope_experiments</text><text x="508" y="214" font-size="15" font-weight="400">id, question, assay, synthetic origin</text></g>
<g data-node-id="acquisition"><rect x="50" y="330" width="340" height="150" rx="10" fill="#e7f2fc" stroke="#1864ab" stroke-width="1.5"/><text x="68" y="364" font-size="18" font-weight="600">Acquisition</text><text x="68" y="395" font-size="15" font-weight="400">assayscope_acquisitions</text><text x="68" y="419" font-size="15" font-weight="400">id, experiment_id, run metadata</text><text x="68" y="443" font-size="15" font-weight="400">Fictional instruments are labeled</text></g>
<g data-node-id="measurement"><rect x="490" y="330" width="340" height="150" rx="10" fill="#e7f2fc" stroke="#1864ab" stroke-width="1.5"/><text x="508" y="364" font-size="18" font-weight="600">Measurement</text><text x="508" y="395" font-size="15" font-weight="400">assayscope_measurements</text><text x="508" y="419" font-size="15" font-weight="400">well_id, run_id, source_image_id</text><text x="508" y="443" font-size="15" font-weight="400">Original values, units, code_version</text></g>
<g data-node-id="provenance"><rect x="930" y="330" width="340" height="150" rx="10" fill="#e6f6f7" stroke="#0c8599" stroke-width="1.5"/><text x="948" y="364" font-size="18" font-weight="600">Provenance</text><text x="948" y="395" font-size="15" font-weight="400">assayscope_provenance</text><text x="948" y="419" font-size="15" font-weight="400">well_id, image_id, path, SHA-256</text><text x="948" y="443" font-size="15" font-weight="400">Axes, spacing, time, method, parameters</text></g>
<g data-node-id="review"><rect x="50" y="595" width="340" height="150" rx="10" fill="#f1f4f6" stroke="#495057" stroke-width="1.5"/><text x="68" y="629" font-size="18" font-weight="600">Private research review</text><text x="68" y="660" font-size="15" font-weight="400">ReviewDecision in app SQL</text><text x="68" y="684" font-size="15" font-weight="400">experiment_id, well_id, user_id</text><text x="68" y="708" font-size="15" font-weight="400">Append-only human rationale</text></g>
<g data-node-id="qc"><rect x="490" y="595" width="340" height="150" rx="10" fill="#fff5df" stroke="#b46b08" stroke-width="1.5"/><text x="508" y="629" font-size="18" font-weight="600">Quality observations</text><text x="508" y="660" font-size="15" font-weight="400">assayscope_qc</text><text x="508" y="684" font-size="15" font-weight="400">well_id, flags_json, thresholds_json</text><text x="508" y="708" font-size="15" font-weight="400">Exclusions never erase measurements</text></g>
<g data-node-id="image"><rect x="930" y="595" width="340" height="150" rx="10" fill="#e6f6f7" stroke="#0c8599" stroke-width="1.5"/><text x="948" y="629" font-size="18" font-weight="600">Canonical image and derivatives</text><text x="948" y="660" font-size="15" font-weight="400">Lakehouse Files / images</text><text x="948" y="684" font-size="15" font-weight="400">TCZYX and physical calibration</text><text x="948" y="708" font-size="15" font-weight="400">Bounded ZYXC uint8 browser transport</text></g>
<text x="30" y="895" font-size="14" font-weight="400">Generator truth is held outside served/uploaded assets and is used only for synthetic evaluation; it is not an analysis input.</text>
<text x="30" y="921" font-size="14" font-weight="400">The notebook checks record joins and versions. Actual image-byte hash verification is a separate integrity check.</text>
</g></svg>
