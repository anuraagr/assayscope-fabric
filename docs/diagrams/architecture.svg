<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title description">
<title id="title">AssayScope deployment architecture</title><desc id="description">Two explicit runtime paths. Shared scientific contracts; different authentication and persistence. Local FastAPI is not a locally managed Rayfin backend. Missing cloud authorization never falls back to fixtures. Notebook execution uses existing capacity. No model service, extra capacity, public host or schedule is required.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526778"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#152938">
<text x="30" y="48" font-size="30" font-weight="650">AssayScope deployment architecture</text><text x="30" y="82" font-size="16" font-weight="400">Two explicit runtime paths. Shared scientific contracts; different authentication and persistence.</text>
<rect x="24" y="120" width="388" height="640" rx="14" fill="none" stroke="#b8c5ce"/><text x="48" y="152" font-size="19" font-weight="600">Local | no cloud dependency</text>
<rect x="440" y="120" width="856" height="640" rx="14" fill="none" stroke="#b8c5ce"/><text x="464" y="152" font-size="19" font-weight="600">Fabric | existing tenant capacity</text><path d="M218 305 L218 365" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M218 485 L218 545" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M802 245 L884 245" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1074 305 L1074 345 L637 345 L637 385" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1200 305 L1200 385" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1074 615 L1074 545" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M802 275 L838 275 L838 590 L637 590 L637 615" fill="none" stroke="#526778" stroke-width="2" marker-end="url(#arrow)"/><g data-node-id="local-ui"><rect x="52" y="185" width="332" height="120" rx="10" fill="#e7f2fc" stroke="#1864ab" stroke-width="1.5"/><text x="70" y="219" font-size="18" font-weight="600">Microscopy workbench</text><text x="70" y="250" font-size="15" font-weight="400">React, vtk.js, OpenSeadragon</text><text x="70" y="274" font-size="15" font-weight="400">Bounded, verified image frames</text></g>
<g data-node-id="local-api"><rect x="52" y="365" width="332" height="120" rx="10" fill="#e7f2fc" stroke="#1864ab" stroke-width="1.5"/><text x="70" y="399" font-size="18" font-weight="600">Local adapter</text><text x="70" y="430" font-size="15" font-weight="400">FastAPI on loopback</text><text x="70" y="454" font-size="15" font-weight="400">No enterprise sign-in simulation</text></g>
<g data-node-id="local-store"><rect x="52" y="545" width="332" height="160" rx="10" fill="#f1f4f6" stroke="#495057" stroke-width="1.5"/><text x="70" y="579" font-size="18" font-weight="600">Files and SQLite</text><text x="70" y="610" font-size="15" font-weight="400">OME images and derived measurements</text><text x="70" y="634" font-size="15" font-weight="400">Instance-local reviews</text><text x="70" y="658" font-size="15" font-weight="400">Public references stay independent</text></g>
<g data-node-id="cloud-ui"><rect x="472" y="185" width="330" height="120" rx="10" fill="#e7f2fc" stroke="#1864ab" stroke-width="1.5"/><text x="490" y="219" font-size="18" font-weight="600">Protected app UI</text><text x="490" y="250" font-size="15" font-weight="400">Fabric portal / Entra SSO</text><text x="490" y="274" font-size="15" font-weight="400">Run-and-interact app permission</text></g>
<g data-node-id="functions"><rect x="884" y="185" width="380" height="120" rx="10" fill="#e7f2fc" stroke="#1864ab" stroke-width="1.5"/><text x="902" y="219" font-size="18" font-weight="600">Rayfin Functions</text><text x="902" y="250" font-size="15" font-weight="400">Registered frames and fixed SQL queries</text><text x="902" y="274" font-size="15" font-weight="400">Caller authorization; app-identity reads</text></g>
<g data-node-id="reviews"><rect x="472" y="385" width="330" height="160" rx="10" fill="#f1f4f6" stroke="#495057" stroke-width="1.5"/><text x="490" y="419" font-size="18" font-weight="600">Transactional review SQL</text><text x="490" y="450" font-size="15" font-weight="400">Caller-scoped, append-only revisions</text><text x="490" y="474" font-size="15" font-weight="400">Human decisions and rationale</text><text x="490" y="498" font-size="15" font-weight="400">Not the image analytics store</text></g>
<g data-node-id="lakehouse"><rect x="884" y="385" width="380" height="160" rx="10" fill="#e6f6f7" stroke="#0c8599" stroke-width="1.5"/><text x="902" y="419" font-size="18" font-weight="600">OneLake Lakehouse</text><text x="902" y="450" font-size="15" font-weight="400">Files: OME-TIFF, NGFF, derivatives</text><text x="902" y="474" font-size="15" font-weight="400">Delta: five analytical tables</text><text x="902" y="498" font-size="15" font-weight="400">SQL endpoint: read-only analysis</text></g>
<g data-node-id="exports"><rect x="472" y="615" width="330" height="120" rx="10" fill="#e6f6f7" stroke="#0c8599" stroke-width="1.5"/><text x="490" y="649" font-size="18" font-weight="600">Research evidence</text><text x="490" y="680" font-size="15" font-weight="400">HTML, CSV, images and provenance</text><text x="490" y="704" font-size="15" font-weight="400">Authorized state-only deep links</text></g>
<g data-node-id="notebook"><rect x="884" y="615" width="380" height="120" rx="10" fill="#fff5df" stroke="#b46b08" stroke-width="1.5"/><text x="902" y="649" font-size="18" font-weight="600">Read-only research notebook</text><text x="902" y="680" font-size="15" font-weight="400">Control dispersion and QC sensitivity</text><text x="902" y="704" font-size="15" font-weight="400">Separate Lakehouse access required</text></g>
<text x="30" y="835" font-size="14" font-weight="400">Local FastAPI is not a locally managed Rayfin backend. Missing cloud authorization never falls back to fixtures.</text>
<text x="30" y="861" font-size="14" font-weight="400">Notebook execution uses existing capacity. No model service, extra capacity, public host or schedule is required.</text>
</g></svg>
